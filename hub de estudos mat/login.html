<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathews Bag - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#f59e0b', 600: '#d97706' } // Amber / Laranja Street
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-500/10 border border-amber-500/20 text-amber-500 rounded-2xl font-black text-2xl tracking-wider mb-2">
        MB
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">Mathews Bag</h1>
      <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Central de Conhecimento & Arsenal Acadêmico</p>
    </div>

    <div id="auth-error" class="hidden p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-xs text-red-400 text-center font-medium"></div>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">E-mail</label>
        <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white placeholder-slate-600">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Senha</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white placeholder-slate-600">
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/10">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar no Bag
      </button>
    </form>

    <div class="relative flex py-2 items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink mx-4 text-[10px] text-slate-500 font-bold tracking-wider uppercase">Acesso Biométrico</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <button id="btn-biometrics" type="button" class="w-full bg-slate-950 border border-slate-800 hover:border-amber-500/50 text-slate-300 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm">
      <i class="fa-solid fa-fingerprint text-amber-500 text-lg"></i> Entrar com Biometria / Digital
    </button>
  </div>

  <script src="auth.js"></script>
</body>
</html>
