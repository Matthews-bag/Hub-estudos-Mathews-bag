<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathews Bag - Arsenal de Conhecimento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-amber-500/10 border border-amber-500/20 text-amber-500 font-black rounded-xl flex items-center justify-center text-lg">
          MB
        </div>
        <div>
          <h1 class="font-black text-white text-lg tracking-tight">Mathews Bag</h1>
          <p id="status-db" class="text-xs text-slate-500">Conectando...</p>
        </div>
      </div>

      <nav class="flex items-center gap-2">
        <button id="btn-dashboard" onclick="switchTab('dashboard')" class="nav-btn px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-950 shadow-md">
          <i class="fa-solid fa-graduation-cap mr-1"></i> Dashboard
        </button>
        <button id="logout-btn" onclick="fazerLogout()" class="px-3 py-2 rounded-xl text-xs font-semibold border border-slate-800 text-slate-400 hover:text-red-400 hover:border-red-500/30 transition ml-2">
          <i class="fa-solid fa-power-off"></i> Sair
        </button>
      </nav>
    </div>
  </header>

  <!-- DASHBOARD PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    <section id="tab-dashboard" class="space-y-8">
      
      <!-- STATS -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-xl flex items-center justify-center text-xl font-bold">
            <i class="fa-solid fa-book"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-400">Total de Matérias</p>
            <h3 id="stat-materias" class="text-2xl font-black text-white">0</h3>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center gap-4">
          <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-xl flex items-center justify-center text-xl font-bold">
            <i class="fa-solid fa-list-check"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-400">Tarefas Pendentes</p>
            <h3 id="stat-pendentes" class="text-2xl font-black text-white">0</h3>
          </div>
        </div>
      </div>

      <!-- MATÉRIAS DA FACULDADE -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-university text-amber-500"></i> Disciplinas UniMetrocamp
          </h2>
          <button onclick="openMateriaModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> Nova Matéria
          </button>
        </div>
        <div id="lista-materias-wyden" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <!-- MATÉRIAS EXTRACURRICULARES -->
      <div class="space-y-4">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-bolt text-amber-500"></i> Estudos Extracurriculares
        </h2>
        <div id="lista-materias-extra" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <!-- TAREFAS / LISTA -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-check-double text-amber-500"></i> Tasks & Exercícios
          </h2>
          <button onclick="openTaskModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-700 flex items-center gap-1">
            <i class="fa-solid fa-plus text-amber-500"></i> Adicionar Task
          </button>
        </div>
        <div id="lista-tarefas" class="space-y-2"></div>
      </div>

    </section>
  </main>

  <!-- MODAL TAREFA -->
  <div id="modal-tarefa" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4">
      <h3 class="text-lg font-bold text-white">Nova Task</h3>
      <form onsubmit="salvarNovaTarefa(event)" class="space-y-3">
        <input type="text" id="task-titulo" required placeholder="Título da tarefa..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
        <select id="task-materia" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500"></select>
        <select id="task-prioridade" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
          <option value="alta">Prioridade Alta</option>
          <option value="media" selected>Prioridade Média</option>
          <option value="baixa">Prioridade Baixa</option>
        </select>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-tarefa')" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800">Cancelar</button>
          <button type="submit" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL MATÉRIA -->
  <div id="modal-materia" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4">
      <h3 class="text-lg font-bold text-white">Nova Matéria / Curso</h3>
      <form onsubmit="salvarNovaMateria(event)" class="space-y-3">
        <input type="text" id="mat-nome" required placeholder="Nome da Matéria..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
        <select id="mat-categoria" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
          <option value="faculdade">Faculdade (UniMetrocamp)</option>
          <option value="extracurricular">Extracurricular / Curso</option>
        </select>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-materia')" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800">Cancelar</button>
          <button type="submit" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
